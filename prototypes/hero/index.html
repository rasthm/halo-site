<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halo hero · prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Hanken+Grotesk:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&family=Rubik:wght@400;500;700&family=Sora:wght@400;600;700&display=swap">
<style>
/* Shared tokens for every variant: white ground, black ink, one orange. Variants differ in idea, not palette. */
:root {
  --bg: #ffffff;
  --paper: #f6f4f0;
  --ink: #111111;
  --ink-2: #4b4844;
  --line: #e6e2dc;
  --orange: #ff5a1f;
  --orange-deep: #c9400c;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.55 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
::selection { background: var(--orange); color: #fff; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

.page { min-height: 100vh; position: relative; overflow: hidden; }
.gut { padding-left: max(20px, 4vw); padding-right: max(20px, 4vw); }

/* nav shared by all variants: same product chrome, so only the hero idea changes */
.nav { position: relative; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-block: 22px; }
.logo { position: relative; padding-top: 11px; display: inline-flex; flex-direction: column; line-height: 1; text-decoration: none; }
.logo b { font: 700 24px 'Familjen Grotesk', sans-serif; letter-spacing: 0.06em; }
.logo i { position: absolute; top: 0; left: 3px; width: 50px; height: 10px; border: 2.5px solid var(--orange); border-radius: 50%; }
.logo small { font-size: 7.5px; letter-spacing: 0.5em; margin-top: 4px; color: var(--ink-2); }
.links { display: flex; gap: 28px; font-size: 15px; color: var(--ink-2); }
.links a { text-decoration: none; }
@media (hover: hover) and (pointer: fine) { .links a:hover { color: var(--ink); } }
@media (max-width: 820px) { .links { display: none; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; border-radius: 999px; font: 600 16px 'Hanken Grotesk', sans-serif; text-decoration: none; border: 0; cursor: pointer; transition: transform 160ms var(--ease-out), background-color 150ms ease-out, box-shadow 200ms ease-out; }
.btn:active { transform: scale(0.97); }
.btn.orange { background: var(--orange); color: #111; box-shadow: 0 10px 26px -12px rgba(255, 90, 31, 0.85); }
.btn.black { background: #111; color: #fff; }
.btn.line { background: transparent; color: #111; box-shadow: inset 0 0 0 1.5px #111; }
@media (hover: hover) and (pointer: fine) {
  .btn.orange:hover { background: #ff6f3a; }
  .btn.black:hover { background: #2a2a2a; }
  .btn.line:hover { box-shadow: inset 0 0 0 2px #111; }
}
.acts { display: flex; gap: 12px; flex-wrap: wrap; }

/* the section below the fold, shared: gives the hero its real context */
.peek { position: relative; z-index: 2; border-top: 1px solid var(--line); padding-block: 56px 140px; background: #fff; }
.peek h2 { margin: 0 0 24px; font: 800 clamp(28px, 3.4vw, 44px)/1 'Hanken Grotesk', sans-serif; letter-spacing: -0.02em; }
.peek ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 32px; }
.peek li { border-top: 2px solid #111; padding: 14px 0 22px; }
.peek li b { display: block; font-size: 19px; }
.peek li span { color: var(--ink-2); font-size: 15px; }
@media (max-width: 820px) { .peek ul { grid-template-columns: 1fr; } }

/* entrance used by every variant: from visible-ish, short, ease-out */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.in { animation: rise 600ms var(--ease-out) both; }
.d1 { animation-delay: 80ms; } .d2 { animation-delay: 160ms; } .d3 { animation-delay: 240ms; } .d4 { animation-delay: 320ms; }

/* ---------- 1 · Highlighter ---------- */
.v1 { font-family: 'Familjen Grotesk', sans-serif; }
.v1 .hero { padding-block: clamp(48px, 9vh, 110px) clamp(56px, 10vh, 120px); display: grid; gap: 32px; }
.v1 h1 { margin: 0; font-size: clamp(48px, 8.6vw, 136px); line-height: 0.94; font-weight: 700; letter-spacing: -0.04em; max-width: 14ch; text-wrap: balance; }
.mark { position: relative; z-index: 0; display: inline-block; }
.mark::before { content: ""; position: absolute; z-index: -1; left: -0.07em; right: -0.07em; top: 0.48em; bottom: 0.04em; background: var(--orange); border-radius: 0.14em 0.42em 0.2em 0.32em; transform: scaleX(0) skewX(-6deg); transform-origin: left center; animation: sweep 520ms var(--ease-out) forwards; }
.mark.m1::before { animation-delay: 450ms; } .mark.m2::before { animation-delay: 950ms; } .mark.m3::before { animation-delay: 1450ms; }
@keyframes sweep { to { transform: scaleX(1) skewX(-6deg); } }
.v1 .rot { font-size: clamp(20px, 2.1vw, 30px); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 0.35em; align-items: baseline; }
.v1 .word { position: relative; color: #111; font-weight: 700; display: inline-block; }
.v1 .word::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0.02em; height: 0.16em; background: var(--orange); transform: scaleX(0); transform-origin: left; }
.v1 .word.on::after { animation: under 420ms var(--ease-out) forwards; }
@keyframes under { to { transform: scaleX(1); } }

/* ---------- 2 · Orbit ---------- */
.v2 { font-family: 'Sora', sans-serif; background: radial-gradient(90% 70% at 50% 62%, #fff 55%, #fff4ee); }
.v2 .hero { position: relative; height: clamp(620px, 84vh, 880px); }
/* The ring is tall enough to encircle the text block: chips pass above the headline and below the buttons, never through them. */
.v2 svg.ring { position: absolute; left: 50%; top: 50%; width: min(1240px, 94vw); height: auto; transform: translate(-50%, -50%); overflow: visible; }
.v2 .ring ellipse.draw { stroke-dasharray: 3600; stroke-dashoffset: 3600; animation: draw 1400ms var(--ease-out) 150ms forwards; }
@media (max-width: 760px) {
  .v2 .hero { height: 760px; }
  .v2 svg.ring { top: 25%; width: 96vw; }
  .v2 .center { top: 66% !important; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
.v2 .chips { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.v2 .chip { position: absolute; left: 0; top: 0; padding: 9px 16px; border-radius: 999px; background: #111; color: #fff; font-size: clamp(13px, 1.2vw, 16px); font-weight: 600; white-space: nowrap; will-change: transform, opacity; }
.v2 .chip.hot { background: var(--orange); color: #111; }
.v2 .center { position: absolute; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(900px, 88vw); text-align: center; }
.v2 h1 { margin: 0; font-size: clamp(36px, 5.2vw, 84px); line-height: 1; letter-spacing: -0.035em; font-weight: 700; }
.v2 h1 em { font-style: normal; color: var(--orange); }
.v2 .center p { margin: 18px auto 26px; max-width: 46ch; color: var(--ink-2); font-size: clamp(16px, 1.4vw, 19px); }
.v2 .acts { justify-content: center; }

/* ---------- 3 · Counter ---------- */
.v3 { font-family: 'Hanken Grotesk', sans-serif; }
.v3 .grid { position: absolute; inset: 0 max(20px, 4vw); display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; pointer-events: none; z-index: 0; }
.v3 .grid i { border-left: 1px solid #f0ede8; border-right: 1px solid #f0ede8; }
.v3 .hero { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; padding-block: clamp(40px, 7vh, 90px) 56px; min-height: clamp(560px, 78vh, 820px); align-content: space-between; }
.v3 h1 { grid-column: 1 / span 8; margin: 0; font-size: clamp(46px, 7vw, 116px); font-weight: 800; line-height: 0.9; letter-spacing: -0.045em; }
.v3 .side { grid-column: 10 / span 3; align-self: start; display: grid; gap: 18px; padding-top: 12px; }
.v3 .side p { margin: 0; color: var(--ink-2); }
.v3 .count { grid-column: 1 / -1; display: flex; align-items: flex-end; gap: clamp(16px, 3vw, 44px); }
.v3 .odo { height: clamp(120px, 17vw, 250px); font-size: clamp(120px, 17vw, 250px); line-height: 1; font-weight: 800; letter-spacing: -0.07em; overflow: hidden; display: flex; }
.v3 .reel { display: flex; flex-direction: column; transition: transform 520ms var(--ease-out); }
.v3 .reel span { display: block; height: clamp(120px, 17vw, 250px); }
.v3 .svc { padding-bottom: clamp(14px, 2vw, 30px); }
.v3 .svc b { display: block; font-size: clamp(26px, 3.6vw, 54px); line-height: 1; letter-spacing: -0.025em; }
.v3 .svc span { color: var(--ink-2); font-size: clamp(15px, 1.3vw, 18px); }
.v3 .block { position: absolute; z-index: 0; width: clamp(56px, 7vw, 104px); aspect-ratio: 1; background: var(--orange); transition: transform 520ms var(--ease-out); }
@media (max-width: 820px) { .v3 h1, .v3 .side { grid-column: 1 / -1; } }

/* ---------- 4 · Workbench ---------- */
.v4 { font-family: 'Rubik', sans-serif; background: linear-gradient(180deg, #fff 0%, #f8f6f2 100%); }
.v4 .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(28px, 4vw, 64px); align-items: center; padding-block: clamp(40px, 7vh, 90px) 72px; }
@media (max-width: 900px) { .v4 .hero { grid-template-columns: 1fr; } }
.v4 h1 { margin: 0 0 20px; font-size: clamp(42px, 5.6vw, 88px); line-height: 0.98; font-weight: 700; letter-spacing: -0.03em; }
.v4 .lede { margin: 0 0 28px; color: var(--ink-2); font-size: clamp(16px, 1.4vw, 19px); max-width: 40ch; }
.v4 .desk { background: #e9e5dd; border-radius: 28px; padding: clamp(16px, 2vw, 28px); box-shadow: inset 0 2px 0 #fff, 0 40px 60px -36px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.08); }
.v4 .lcd { background: #121212; border-radius: 14px; padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--orange); font-family: 'JetBrains Mono', monospace; }
.v4 .lcd b { font-size: clamp(36px, 4.4vw, 64px); font-weight: 700; text-shadow: 0 0 14px rgba(255, 90, 31, 0.45); font-variant-numeric: tabular-nums; }
.v4 .lcd span { font-size: 11px; letter-spacing: 0.12em; text-align: right; color: #ff9a6e; }
.v4 .keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
.v4 .key { position: relative; min-height: clamp(78px, 8vw, 112px); border: 0; border-radius: 14px; background: linear-gradient(#fbf9f4, #ece8df); box-shadow: 0 6px 0 #bdb6a8, 0 10px 14px rgba(0,0,0,0.12); display: flex; align-items: flex-end; padding: 12px 14px; font: 500 clamp(13px, 1.15vw, 16px) 'Rubik', sans-serif; color: #111; text-align: left; cursor: pointer; transition: transform 90ms ease-out, box-shadow 90ms ease-out; }
.v4 .key i { position: absolute; top: 12px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: #cfc8bb; transition: background-color 150ms ease-out, box-shadow 150ms ease-out; }
.v4 .key.down, .v4 .key:active { transform: translateY(5px); box-shadow: 0 1px 0 #bdb6a8, 0 3px 5px rgba(0,0,0,0.12); }
.v4 .key.lit i { background: var(--orange); box-shadow: 0 0 9px rgba(255, 90, 31, 0.95); }
.v4 .row { display: flex; gap: 14px; margin-top: 18px; align-items: center; }
.v4 .knob { flex: none; width: clamp(78px, 8vw, 112px); aspect-ratio: 1; border-radius: 50%; background: repeating-conic-gradient(#b9b4ab 0 5deg, #8d887f 5deg 10deg); box-shadow: 0 8px 14px rgba(0,0,0,0.25); position: relative; transition: transform 500ms var(--ease-out); }
.v4 .knob::after { content: ""; position: absolute; left: 50%; top: 8%; width: 6px; height: 26%; margin-left: -3px; background: #111; border-radius: 2px; }
.v4 .go { flex: 1; min-height: clamp(78px, 8vw, 112px); border-radius: 14px; background: var(--orange); box-shadow: 0 6px 0 var(--orange-deep); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: clamp(18px, 1.8vw, 24px); color: #111; text-decoration: none; transition: transform 90ms ease-out, box-shadow 90ms ease-out; }
.v4 .go:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--orange-deep); }

/* ---------- 5 · Live Flow ---------- */
.v5 { font-family: 'Hanken Grotesk', sans-serif; }
.v5 .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 4vw, 64px); align-items: center; padding-block: clamp(40px, 7vh, 90px) 72px; }
@media (max-width: 900px) { .v5 .hero { grid-template-columns: 1fr; } }
.v5 h1 { margin: 0 0 20px; font-size: clamp(42px, 5.8vw, 92px); line-height: 0.95; font-weight: 800; letter-spacing: -0.04em; }
.v5 h1 span { color: var(--orange); }
.v5 .lede { margin: 0 0 28px; color: var(--ink-2); font-size: clamp(16px, 1.4vw, 19px); max-width: 40ch; }
.v5 .flow { display: grid; gap: 14px; padding: clamp(16px, 2vw, 26px); border-radius: 22px; background: var(--paper); }
.v5 .ex { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
.v5 .step { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; align-items: start; opacity: 0.28; transform: translateY(8px); transition: opacity 300ms ease-out, transform 450ms var(--ease-out); }
.v5 .step.on { opacity: 1; transform: none; }
.v5 .ico { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #111; display: grid; place-items: center; font-weight: 800; background: #fff; transition: background-color 200ms ease-out, border-color 200ms ease-out; }
.v5 .step.on .ico { background: var(--orange); border-color: var(--orange); }
.v5 .card { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: #fff; box-shadow: 0 12px 24px -20px rgba(0,0,0,0.35); }
.v5 .card small { display: block; font-size: 12px; color: var(--ink-2); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
.v5 .bubble { background: #eaf8ef; border-color: #cbead6; }
.v5 .bar { height: 7px; background: #f0ece6; border-radius: 9px; margin-top: 10px; overflow: hidden; }
.v5 .bar i { display: block; height: 100%; width: 100%; background: var(--orange); transform: scaleX(0); transform-origin: left; transition: transform 1300ms cubic-bezier(0.4, 0, 0.2, 1); }
.v5 .appr { display: inline-block; margin-top: 8px; padding: 7px 16px; border-radius: 999px; background: #111; color: #fff; font-size: 14px; font-weight: 700; transition: background-color 180ms ease-out, transform 160ms var(--ease-out); }
.v5 .appr.pressed { background: var(--orange); color: #111; transform: scale(0.97); }

@media (prefers-reduced-motion: reduce) {
  .in, .mark::before, .v1 .word.on::after, .v2 .ring ellipse.draw { animation: none !important; opacity: 1; transform: none; }
  .mark::before { transform: scaleX(1) skewX(-6deg); }
  .v2 .ring ellipse.draw { stroke-dashoffset: 0; }
  .v3 .reel, .v3 .block, .v4 .knob, .v5 .step, .v5 .bar i { transition: none; }
}

/* ---------- picker (verbatim from PICKER.md) ---------- */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition:
    color 150ms ease-out,
    transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (hover: hover) and (pointer: fine) {
  .proto-picker-item:hover {
    color: rgba(255, 255, 255, 0.85);
  }
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}
</style>
</head>
<body>
<main id="stage"></main>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Highlighter</button>
  <button class="proto-picker-item">Orbit</button>
  <button class="proto-picker-item">Counter</button>
  <button class="proto-picker-item">Workbench</button>
  <button class="proto-picker-item">Live Flow</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SERVICES = [
  ['Websites', 'Live in 3–5 days'],
  ['Web apps', 'Live in 3–4 weeks'],
  ['Automations', 'Live in 2–3 weeks'],
  ['Company brain', 'Scoped on a call'],
  ['Integrations', 'Live in 2–3 weeks'],
  ['APIs & reels', 'Live in 2–3 weeks'],
];

const nav = (cta = 'black') => `
  <header class="nav gut">
    <a class="logo" href="#" aria-label="Halo Automations, home"><i></i><b>HALO</b><small>AUTOMATIONS</small></a>
    <nav class="links" aria-label="Main"><a href="#">Services</a><a href="#">Results</a><a href="#">Company brain</a><a href="#">Work</a><a href="#">About</a></nav>
    <a class="btn ${cta}" href="#">Book a call</a>
  </header>`;

const peek = `
  <section class="peek gut">
    <h2>Six things we build, one team.</h2>
    <ul>
      <li><b>Websites</b><span>Fast sites that bring in enquiries · live in 3–5 days</span></li>
      <li><b>Automations &amp; AI agents</b><span>Quotes, follow-ups and reports done for your team · 2–3 weeks</span></li>
      <li><b>Company brain</b><span>A private AI that answers your team in seconds</span></li>
    </ul>
  </section>`;

// Each variant: render() returns its markup; start(root) runs its motion and returns a stop function.
const VARIANTS = [
  {
    render: () => `<div class="page v1">${nav()}
      <section class="hero gut">
        <h1 class="in"><span class="mark m1">Everything</span> your business <span class="mark m2">runs on,</span> built by <span class="mark m3">one team.</span></h1>
        <div class="rot in d2">We build your <span class="word on" id="w">websites</span> and measure it in hours and money.</div>
        <div class="acts in d3"><a class="btn orange" href="#">Book a call</a><a class="btn line" href="#">WhatsApp us</a></div>
      </section>${peek}</div>`,
    start(root) {
      if (reduce) return () => {};
      const el = root.querySelector('#w');
      const words = ['websites', 'web apps', 'automations', 'company brain', 'integrations', 'APIs & reels'];
      let i = 0;
      const t = setInterval(() => {
        i = (i + 1) % words.length;
        el.classList.remove('on'); void el.offsetWidth;
        el.textContent = words[i]; el.classList.add('on');
      }, 2200);
      return () => clearInterval(t);
    },
  },
  {
    render: () => `<div class="page v2">${nav()}
      <section class="hero">
        <svg class="ring" viewBox="-560 -280 1120 560" aria-hidden="true">
          <ellipse rx="520" ry="245" fill="none" stroke="#ff5a1f" stroke-opacity="0.14" stroke-width="44"/>
          <ellipse class="draw" rx="520" ry="245" fill="none" stroke="#ff5a1f" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="chips" aria-hidden="true"></div>
        <div class="center">
          <h1 class="in d1">Everything your business runs on. <em>One team.</em></h1>
          <p class="in d2">Websites, apps, automations, integrations and a private AI brain, measured in hours and money.</p>
          <div class="acts in d3"><a class="btn orange" href="#">Book a call</a><a class="btn line" href="#">WhatsApp us</a></div>
        </div>
      </section>${peek}</div>`,
    start(root) {
      const host = root.querySelector('.chips');
      const svg = root.querySelector('svg.ring');
      const hero = root.querySelector('.hero');
      const chips = SERVICES.map(([n], i) => {
        const c = document.createElement('div');
        c.className = 'chip' + (i === 2 ? ' hot' : '');
        c.textContent = n; host.appendChild(c); return c;
      });
      let raf = 0; const t0 = performance.now();
      const frame = (now) => {
        const r = svg.getBoundingClientRect(), o = hero.getBoundingClientRect();
        const cx = r.left - o.left + r.width / 2, cy = r.top - o.top + r.height / 2;
        const rx = r.width * (520 / 1120), ry = r.height * (245 / 560);
        const t = reduce ? 0 : (now - t0) / 1000;
        chips.forEach((c, i) => {
          const a = t * 0.28 + i * (Math.PI * 2 / chips.length) + 0.4;
          const x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
          const front = Math.sin(a);
          const s = 0.84 + 0.2 * (front + 1) / 2;
          c.style.transform = `translate(${(x - c.offsetWidth / 2).toFixed(1)}px, ${(y - c.offsetHeight / 2).toFixed(1)}px) scale(${s.toFixed(3)})`;
          c.style.zIndex = front > 0 ? 4 : 1;
          c.style.opacity = (0.5 + 0.5 * (front + 1) / 2).toFixed(2);
        });
        if (!reduce) raf = requestAnimationFrame(frame);
      };
      raf = requestAnimationFrame(frame);
      return () => cancelAnimationFrame(raf);
    },
  },
  {
    render: () => `<div class="page v3">
      <div class="grid" aria-hidden="true">${'<i></i>'.repeat(12)}</div>
      <div class="block" aria-hidden="true"></div>
      ${nav()}
      <section class="hero gut">
        <h1 class="in d1">Everything your business runs on.</h1>
        <div class="side in d2"><p>Six things, built by one team and measured in hours and money.</p><div class="acts"><a class="btn orange" href="#">Book a call</a></div></div>
        <div class="count in d3">
          <div class="odo" aria-hidden="true"><div class="reel">0</div><div class="reel" id="reel">${SERVICES.map((_, i) => `<span>${i + 1}</span>`).join('')}</div></div>
          <div class="svc" aria-live="polite"><b id="sn">Websites</b><span id="sl">Live in 3–5 days</span></div>
        </div>
      </section>${peek}</div>`,
    start(root) {
      const reel = root.querySelector('#reel'), sn = root.querySelector('#sn'), sl = root.querySelector('#sl');
      const block = root.querySelector('.block'), page = root.querySelector('.page');
      // Only the empty middle-right of the hero: clear of the headline, the side copy and button, and the counter.
      const wide = page.offsetWidth > 760;
      const spots = wide
        ? [[0.54, 0.48], [0.64, 0.62], [0.74, 0.50], [0.85, 0.64], [0.58, 0.72], [0.80, 0.77]]
        : [[0.62, 0.30], [0.80, 0.36], [0.70, 0.42], [0.84, 0.29], [0.58, 0.40], [0.76, 0.31]];
      let i = 0;
      const set = (k) => {
        const h = reel.firstElementChild.offsetHeight;
        reel.style.transform = `translateY(${-k * h}px)`;
        sn.textContent = SERVICES[k][0]; sl.textContent = SERVICES[k][1];
        const w = page.offsetWidth, hh = Math.min(page.offsetHeight, innerHeight);
        block.style.transform = `translate(${(spots[k][0] * w).toFixed(0)}px, ${(spots[k][1] * hh).toFixed(0)}px)`;
      };
      set(0);
      if (reduce) return () => {};
      const t = setInterval(() => { i = (i + 1) % SERVICES.length; set(i); }, 1900);
      return () => clearInterval(t);
    },
  },
  {
    render: () => `<div class="page v4">${nav()}
      <section class="hero gut">
        <div>
          <h1 class="in d1">Everything your business runs on, on one desk.</h1>
          <p class="lede in d2">Press a key. One team builds it, and the readout shows the hours an example estimate gives back.</p>
          <div class="acts in d3"><a class="btn line" href="#">WhatsApp us</a></div>
        </div>
        <div class="desk in d2">
          <div class="lcd"><b id="num">0 h</b><span>HOURS BACK / MONTH<br>EXAMPLE ESTIMATE</span></div>
          <div class="keys">${SERVICES.map(([n]) => `<button class="key" type="button"><i></i>${n.replace('&', '&amp;')}</button>`).join('')}</div>
          <div class="row"><div class="knob" aria-hidden="true"></div><a class="go" href="#">Book a call</a></div>
        </div>
      </section>${peek}</div>`,
    start(root) {
      const keys = [...root.querySelectorAll('.key')], num = root.querySelector('#num'), knob = root.querySelector('.knob');
      const targets = [12, 24, 76, 38, 30, 18];
      let shown = 0, raf = 0, i = 0, t = 0;
      const countTo = (v) => {
        cancelAnimationFrame(raf);
        const from = shown, t0 = performance.now();
        const f = (now) => {
          const p = Math.min(1, (now - t0) / 650), e = 1 - Math.pow(1 - p, 3);
          shown = Math.round(from + (v - from) * e); num.textContent = shown + ' h';
          if (p < 1) raf = requestAnimationFrame(f);
        };
        raf = requestAnimationFrame(f);
      };
      const press = (k, auto) => {
        keys.forEach((x) => x.classList.remove('lit'));
        const key = keys[k]; key.classList.add('lit');
        if (auto) { key.classList.add('down'); setTimeout(() => key.classList.remove('down'), 130); }
        knob.style.transform = `rotate(${k * 48 - 120}deg)`;
        if (reduce) { shown = targets[k]; num.textContent = shown + ' h'; } else countTo(targets[k]);
      };
      keys.forEach((k, idx) => k.addEventListener('click', () => { clearInterval(t); i = idx; press(idx, false); }));
      press(0, true);
      if (!reduce) t = setInterval(() => { i = (i + 1) % keys.length; press(i, true); }, 1700);
      return () => { clearInterval(t); cancelAnimationFrame(raf); };
    },
  },
  {
    render: () => `<div class="page v5">${nav()}
      <section class="hero gut">
        <div>
          <h1 class="in d1">Everything your business runs on, <span>working while you sleep.</span></h1>
          <p class="lede in d2">Watch one enquiry travel through a Halo system: read, priced, approved by you, sent.</p>
          <div class="acts in d3"><a class="btn orange" href="#">Book a call</a><a class="btn line" href="#">WhatsApp us</a></div>
        </div>
        <div class="flow in d2">
          <div class="ex">Example flow · illustrative</div>
          <div class="step"><div class="ico">1</div><div class="card bubble"><small>WhatsApp · 9:12 pm</small>Hi, can you quote 400 units by the 30th?</div></div>
          <div class="step"><div class="ico">2</div><div class="card"><small>Halo reads stock and past quotes</small>Drafting the quote<div class="bar"><i></i></div></div></div>
          <div class="step"><div class="ico">3</div><div class="card"><small>Needs your yes</small>Quote ready for review<br><span class="appr">Approve</span></div></div>
          <div class="step"><div class="ico">4</div><div class="card"><small>Done</small>Quote sent, CRM updated, follow-up set for Thursday</div></div>
        </div>
      </section>${peek}</div>`,
    start(root) {
      const steps = [...root.querySelectorAll('.step')], bar = root.querySelector('.bar i'), appr = root.querySelector('.appr');
      const timers = [];
      const all = () => { steps.forEach((s) => s.classList.add('on')); bar.style.transform = 'scaleX(1)'; appr.classList.add('pressed'); appr.textContent = 'Approved'; };
      if (reduce) { all(); return () => {}; }
      const run = () => {
        steps.forEach((s) => s.classList.remove('on')); bar.style.transform = 'scaleX(0)'; appr.classList.remove('pressed'); appr.textContent = 'Approve';
        timers.push(setTimeout(() => steps[0].classList.add('on'), 500));
        timers.push(setTimeout(() => { steps[1].classList.add('on'); bar.style.transform = 'scaleX(1)'; }, 1400));
        timers.push(setTimeout(() => steps[2].classList.add('on'), 3000));
        timers.push(setTimeout(() => { appr.classList.add('pressed'); appr.textContent = 'Approved'; }, 4200));
        timers.push(setTimeout(() => steps[3].classList.add('on'), 4800));
      };
      run();
      const loop = setInterval(run, 9000);
      return () => { clearInterval(loop); timers.forEach(clearTimeout); };
    },
  },
];

// The picker's reference wiring (PICKER.md), with each variant's motion started after mount and stopped on switch.
const variants = VARIANTS.map((v) => v.render);
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
let stop = () => {};

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stop(); stop = () => {};
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => {
    stage.innerHTML = variants[i]();
    stop = VARIANTS[i].start(stage) || (() => {});
  });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
